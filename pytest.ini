[pytest]
; پایه‌ریزی حداقلی pytest — طبق بخش ۵ اسپک ("Testing: pytest,
; pytest-qt, mypy type checking") و آیتم High #۳ از Audit.
; هدف این فایل فقط راه‌انداختن scaffolding واقعی است، نه پوشش کامل.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; اجرای `pytest` از ریشه‌ی پروژه یا از هرجای دیگر باید یکسان کار کند.
pythonpath = .
